<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hijime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#08080a; --bg2:#101012; --surface:#151517; --surface2:#1c1c1f; --surface3:#242427;
  --line:#2a2a2e; --line-soft:rgba(255,255,255,.055); --hair:rgba(255,255,255,.08);
  --text:#f3f3f1; --muted:#96969c; --muted2:#6f6f75;
  --accent:#e9e9ec; --accent-2:#bcbcc2; --accent-3:#87878e;
  --accent-text:#0a0a0b;
  --danger:#d05a5a; --good:#7fae7a; --warn:#c9a24f;
  --silver-grad:linear-gradient(150deg,#fdfdfe 0%,#dcdce0 30%,#a9a9b0 62%,#f2f2f4 100%);
  --silver-grad-soft:linear-gradient(150deg,#3a3a3f 0%,#2a2a2e 45%,#232326 100%);
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -6px rgba(0,0,0,.55);
  --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -14px rgba(0,0,0,.65);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Prompt','Noto Sans Thai',sans-serif; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale; letter-spacing:.005em;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:-webkit-fill-available;}
body{
  min-height:100dvh; min-height:-webkit-fill-available;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.05), transparent 60%),
    radial-gradient(900px 500px at 100% 100%, rgba(180,180,190,.04), transparent 55%),
    var(--bg);
  position:relative;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; mix-blend-mode:overlay;
  background-image:
    radial-gradient(rgba(255,255,255,.035) .6px, transparent .6px);
  background-size:3px 3px;
}
h1,h2,h3,.disp{font-family:'Prompt','Noto Sans Thai',sans-serif; font-weight:600; letter-spacing:.01em;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

#frame{
  max-width:430px; margin:0 auto; min-height:100dvh;
  background:linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
  position:relative; z-index:1; display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 40px 100px rgba(0,0,0,.6);
}
@media (min-width:431px){
  #frame{ box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 50px 120px rgba(0,0,0,.75), 0 0 90px rgba(200,200,210,.05); }
}
.topbar{
  position:sticky; top:0; z-index:30;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(10,10,11,.68); backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
  box-shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 24px -14px rgba(0,0,0,.6);
  display:flex; align-items:center; gap:10px;
  animation:barIn .35s ease both;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--surface2),var(--surface)); color:var(--text); display:flex; align-items:center;
  justify-content:center; flex:none; box-shadow:var(--shadow-inset), 0 3px 8px rgba(0,0,0,.35);
  transition:.18s cubic-bezier(.2,.8,.2,1);
}
.back-btn:hover{background:var(--surface2); border-color:#3f3f44; transform:translateX(-2px)}
.back-btn:active{transform:scale(.9)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px;object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,.4)}
.brand-mark{width:28px;height:28px;border-radius:8px;flex:none;background:var(--silver-grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent-text);letter-spacing:0;box-shadow:0 3px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.15)}
.brand-name{font-weight:700;letter-spacing:.02em;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#ffffff,#c8c8ce); -webkit-background-clip:text; background-clip:text; color:transparent;}
.topbar .spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface2),var(--surface));display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--shadow-inset), 0 3px 8px rgba(0,0,0,.35);transition:.18s cubic-bezier(.2,.8,.2,1)}
.icon-btn:hover{background:var(--surface2);border-color:#454549}
.icon-btn:active{transform:scale(.88)}

main{flex:1; padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px)); overflow-x:hidden; position:relative; z-index:1;}
#pageContent{animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;}
@keyframes pageIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
@keyframes barIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)}}
@keyframes cardIn{from{opacity:0; transform:translateY(8px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)}}
.card{background:linear-gradient(165deg,var(--surface) 0%, var(--surface) 55%, #131315 100%); border:1px solid var(--line); border-radius:18px; padding:16px;
  box-shadow:var(--shadow-1), var(--shadow-inset);
  position:relative; overflow:hidden; transition:border-color .2s, transform .15s, box-shadow .2s; animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);}
.card:active{transform:scale(.99)}
main .card:nth-of-type(1){animation-delay:.02s}
main .card:nth-of-type(2){animation-delay:.06s}
main .card:nth-of-type(3){animation-delay:.1s}
main .card:nth-of-type(4){animation-delay:.14s}
.card + .card{margin-top:12px}
.section-title{font-size:12.5px; color:var(--muted); letter-spacing:.08em; margin:18px 2px 8px; text-transform:uppercase; font-weight:600;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:13px; border:1px solid var(--line); background:linear-gradient(160deg,var(--surface2),var(--surface)); color:var(--text); font-weight:600; font-size:14px; box-shadow:var(--shadow-inset), 0 2px 6px rgba(0,0,0,.3); transition:transform .15s cubic-bezier(.2,.8,.2,1), border-color .15s, box-shadow .15s, background .15s;}
.btn:hover{border-color:#48484d; transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-accent{background:var(--silver-grad); color:var(--accent-text); border-color:#dcdce0; box-shadow:0 4px 16px rgba(210,210,220,.18), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 4px rgba(0,0,0,.12); font-weight:700;}
.btn-accent:hover{filter:brightness(1.04)}
.btn-accent:active{box-shadow:0 2px 6px rgba(210,210,220,.12), inset 0 1px 0 rgba(255,255,255,.5);}
.btn-block{width:100%}
.btn-ghost{background:transparent; box-shadow:none;}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger); box-shadow:none;}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{
  width:100%; padding:12px 14px; border-radius:13px; border:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg2),var(--bg)); color:var(--text); font-size:14px; outline:none;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02);
  transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent-2); box-shadow:inset 0 2px 6px rgba(0,0,0,.35), 0 0 0 3px rgba(220,220,226,.08);}
textarea{resize:vertical; min-height:80px}
label{font-size:12px; color:var(--muted); display:block; margin:12px 0 6px; letter-spacing:.02em;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pill{display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); font-size:12px; color:var(--muted); transition:.15s; box-shadow:var(--shadow-inset);}
.pill.on{background:var(--silver-grad); color:var(--accent-text); border-color:#dcdce0; font-weight:600; box-shadow:0 2px 8px rgba(210,210,220,.2), inset 0 1px 0 rgba(255,255,255,.6);}
.char-pill{display:inline-flex; align-items:center; gap:6px; padding:6px 8px 6px 14px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); font-size:12.5px; margin:0 6px 6px 0; animation:cardIn .25s cubic-bezier(.2,.8,.2,1) both; box-shadow:var(--shadow-inset);}
.char-pill button{width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.char-pill button:hover{background:var(--danger);color:#fff}
.char-add-row{display:flex;gap:8px;margin-top:8px;}
.char-add-row input{flex:1}
.avatar{width:74px;height:74px;border-radius:22px;object-fit:cover;background:var(--surface2); border:1px solid var(--line); box-shadow:var(--shadow-1);}
.avatar-lg{width:104px;height:104px;border-radius:28px;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px rgba(233,233,236,.4),0 10px 28px rgba(0,0,0,.5);}
.muted{color:var(--muted)}
.row{display:flex; align-items:center; gap:12px}
.between{display:flex; align-items:center; justify-content:space-between}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line) 15%,var(--line) 85%,transparent); margin:14px 0}
.poster{width:100%; aspect-ratio:1546/423; object-fit:cover; border-radius:16px; background:var(--surface2); border:1px solid var(--line); box-shadow:var(--shadow-1);}
.badge-num{font-variant-numeric:tabular-nums; letter-spacing:.06em;}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px) scale(.95); background:linear-gradient(160deg,var(--surface2),var(--surface)); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.5), var(--shadow-inset); opacity:0; transition:opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
.bottomnav{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%);
  width:100%; max-width:430px; z-index:40; display:flex; border-top:1px solid var(--line-soft);
  background:rgba(10,10,11,.78); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 -1px 0 rgba(255,255,255,.03), 0 -20px 40px -18px rgba(0,0,0,.7);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.navbtn{flex:1; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:10.5px; border:none; background:transparent; position:relative; transition:color .2s, transform .15s;}
.navbtn.active{color:var(--text)}
.navbtn:active{transform:scale(.92)}
.navbtn svg{width:20px;height:20px; transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.navbtn.active svg{transform:translateY(-1px) scale(1.08); filter:drop-shadow(0 2px 6px rgba(255,255,255,.18));}
.nav-indicator{position:absolute; top:0; height:2px; background:var(--silver-grad); border-radius:2px; box-shadow:0 0 8px rgba(230,230,235,.5);
  transition:left .3s cubic-bezier(.34,1.2,.4,1), width .3s cubic-bezier(.34,1.2,.4,1);}
.float-status{
  position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); right:calc((100% - 430px)/2 + 12px);
  z-index:50; max-width:220px;
}
@media (max-width:460px){.float-status{right:12px}}
.float-toggle{
  width:40px;height:40px;border-radius:50%;background:rgba(28,28,31,.55); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.09); display:flex; align-items:center; justify-content:center;
  color:var(--muted); float:right; box-shadow:0 4px 14px rgba(0,0,0,.4); transition:transform .2s cubic-bezier(.34,1.56,.64,1), color .2s;
}
.float-toggle:active{transform:scale(.88)}
.float-toggle.on{color:var(--text); transform:rotate(180deg);}
.float-panel{
  margin-top:8px; background:rgba(21,21,24,.6); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:10px; max-height:220px; overflow:auto;
  box-shadow:0 12px 34px rgba(0,0,0,.45), var(--shadow-inset); transform-origin:top right;
  animation:floatPanelIn .22s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes floatPanelIn{from{opacity:0; transform:scale(.9) translateY(-6px)} to{opacity:1; transform:scale(1) translateY(0)}}
.float-panel .item{display:flex;align-items:center;gap:8px;padding:6px 4px; font-size:12px;}
.dot{width:7px;height:7px;border-radius:50%;background:#666; flex:none}
.dot.online{background:#8fc189}
.dot.busy{background:#c9a24f}
.dot.off{background:#555}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65); z-index:100; display:flex; align-items:flex-end; justify-content:center;
  animation:backdropIn .22s ease both; backdrop-filter:blur(3px);}
@keyframes backdropIn{from{opacity:0} to{opacity:1}}
@keyframes sheetIn{from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:translateY(0)}}
.modal{width:100%; max-width:430px; background:linear-gradient(180deg,var(--surface),#121214); border:1px solid var(--line); border-top:1px solid rgba(255,255,255,.12); border-radius:24px 24px 0 0; padding:10px 18px 20px; max-height:88vh; overflow:auto;
  animation:sheetIn .32s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 -20px 50px rgba(0,0,0,.55);}
.modal-handle{width:36px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--line),#444,var(--line));margin:0 auto 12px;}
.modal-top{background:var(--surface); border-radius:0 0 22px 22px; align-self:flex-start; margin-top:0;}
.grid-members{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.member-card{background:linear-gradient(165deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center;
  box-shadow:var(--shadow-inset); transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s;}
.member-card:active{transform:scale(.95); border-color:#4a4a4f;}
.member-card img{width:56px;height:56px;border-radius:16px;object-fit:cover; margin-bottom:6px; box-shadow:0 3px 10px rgba(0,0,0,.4);}
.wheel-wrap{position:relative; display:flex; justify-content:center; margin:14px 0 6px; filter:drop-shadow(0 14px 32px rgba(0,0,0,.55));}
.wheel-pointer{position:absolute; top:-10px; left:50%; transform:translateX(-50%); z-index:5; width:26px; height:30px;}
.wheel-hub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, var(--accent-2) 60%); border:3px solid var(--bg); box-shadow:0 4px 16px rgba(0,0,0,.55); z-index:4;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.wheel-hub.spinning{animation:hubPulse .6s ease-in-out infinite;}
@keyframes hubPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.55)} 50%{box-shadow:0 4px 28px rgba(230,230,235,.6)}}
.wheel-legend{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left;}
.wheel-legend .item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;font-size:13px;box-shadow:var(--shadow-inset);}
.wheel-legend .swatch{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.25);}
.wheel-legend .pct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;}
.empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:13px;}
.tag-input{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag-input .pill{cursor:pointer}
.login-wrap{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1;}
.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.tabbar button{white-space:nowrap;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid #4a4a4f;border-top-color:var(--text);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11px;color:var(--muted); margin-top:4px;}
fieldset{border:1px solid var(--line); border-radius:14px; margin:12px 0; padding:10px; box-shadow:var(--shadow-inset);}
legend{padding:0 6px; font-size:12px; color:var(--muted);}
.status-select{width:auto; display:inline-block; padding:6px 10px; font-size:12px;}
.footer-admin{padding:30px 16px 50px; text-align:center;}
.footer-admin summary{cursor:pointer; color:var(--muted); font-size:12px; list-style:none;}
.footer-admin summary::-webkit-details-marker{display:none}

/* ---- boot splash ---- */
#bootSplash{position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; transition:opacity .35s ease, visibility .35s ease;}
#bootSplash .boot-mark{width:56px;height:56px;border-radius:18px;background:var(--silver-grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--accent-text);box-shadow:0 10px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7); animation:hubPulse 1.4s ease-in-out infinite;}
#bootSplash .spinner{border-color:#333;border-top-color:var(--muted);}
#bootSplash.hide{opacity:0; visibility:hidden; pointer-events:none;}

/* ---- stat card (total members etc.) ---- */
.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-card{background:linear-gradient(160deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:18px; padding:14px; position:relative; overflow:hidden; box-shadow:var(--shadow-1), var(--shadow-inset); animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both;}
.stat-card::after{content:'';position:absolute;top:-30%;right:-20%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(233,233,236,.14),transparent 70%);}
.stat-card .stat-num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.1;}
.stat-card .stat-label{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;}
.stat-card .stat-icon{width:22px;height:22px;border-radius:7px;background:rgba(233,233,236,.12);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
.stat-icon svg{width:13px;height:13px;}

/* ---- points badge (silver / graphite variants) ---- */
.points-badge{display:inline-flex; align-items:center; gap:8px; padding:8px 14px 8px 10px; border-radius:15px;
  background:linear-gradient(135deg,#2c2c30,#19191b 60%); border:1px solid #3a3a3f; position:relative; overflow:hidden; box-shadow:var(--shadow-inset), 0 3px 10px rgba(0,0,0,.3);}
.points-badge::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%); background-size:220% 100%; animation:pointsShine 3.2s ease-in-out infinite;}
@keyframes pointsShine{0%{background-position:140% 0} 100%{background-position:-40% 0}}

/* ---------------- Firebase ---------------- */

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>t.classList.remove('show'), 2200);

function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid8(){ return String(Math.floor(10000000+Math.random()*89999999)); }
function fmtDate(ts){
  if(!ts) return '-';
  let d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function calcAge(dob){
  if(!dob) return '-';
  const b = new Date(dob), n = new Date();
  let a = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  return a;
}
function fileToResizedDataURL(file, maxW, quality){
  quality = quality || 0.82;
  return new Promise((res,rej)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
// เก็บรูปเป็น Base64 ตรงใน Firestore เลย (ไม่ใช้ Firebase Storage แล้ว)
// Firestore จำกัดขนาดต่อเอกสารไว้ที่ 1MB จึงบีบรูปให้เหลือ margin ที่ปลอดภัย (~700KB ต่อรูป)
async function uploadImage(file, path, maxW){
  const MAX_BYTES = 700000;
  let w = maxW || 1000;
  let quality = 0.82;
  let dataUrl = await fileToResizedDataURL(file, w, quality);
  let tries = 0;
  while(dataUrl.length > MAX_BYTES && tries < 6){
    quality = Math.max(0.35, quality - 0.12);
    w = Math.round(w * 0.85);
    dataUrl = await fileToResizedDataURL(file, w, quality);
    tries++;
  }
  if(dataUrl.length > MAX_BYTES){
    throw new Error('ไฟล์รูปมีขนาดใหญ่เกินไป กรุณาเลือกรูปที่มีขนาดเล็กลง');
  }
  return dataUrl;
}

const COSPLAY_STYLES = ["อนิเมะ/มังงะ","เกม","ออริจินัลคาแรกเตอร์","ประวัติศาสตร์/ย้อนยุค","ภาพยนตร์/ซีรีส์","แฟนตาซี/ครีเจอร์"];

/* ---------------- state ---------------- */
let state = {
  user:null, profile:null, route:'#/login', stack:[],
  siteConfig:{
    siteName:'Hijime', logoURL:'', accent:'#e7e5df', adminUser:'admin', adminPass:'test',
    levels:[], discordPtOnTime:2, discordPtLate:1, discordGraceMinutes:15
  },
  adminAuthed: sessionStorage.getItem('hijime_admin')==='1',
  allUsers:[], missions:[], missionCats:[], events:[], wheels:[], posts:[],
  rewards:[], discordSchedule:[], allRedemptions:[], blacklist:[],
  myRedemptions:[], myCheckins:[],
  floatOpen:false, openComments:{}, leaderboardTab:'gp', blacklistTab:'trade'
};
const DEFAULT_LEVELS = [
  {name:'มือใหม่', gp:0}, {name:'หน้าใหม่', gp:50}, {name:'ตัวจริง', gp:150},
  {name:'มืออาชีพ', gp:300}, {name:'ผู้เชี่ยวชาญ', gp:600}, {name:'ปรมาจารย์', gp:1000},
  {name:'ตำนาน', gp:1600}, {name:'เทพเจ้า', gp:2500}
];
function getLevels(){
  const arr = (state.siteConfig.levels && state.siteConfig.levels.length) ? state.siteConfig.levels : DEFAULT_LEVELS;
  return arr.slice().sort((a,b)=>Number(a.gp||0)-Number(b.gp||0));
}
function levelInfo(gp){
  gp = Number(gp||0);
  const levels = getLevels();
  let idx = 0;
  for(let i=0;i<levels.length;i++){ if(gp >= Number(levels[i].gp||0)) idx = i; }
  const cur = levels[idx];
  const next = levels[idx+1] || null;
  const curGp = Number(cur.gp||0);
  const nextGp = next ? Number(next.gp||0) : null;
  const pct = next ? Math.max(0,Math.min(100, ((gp-curGp)/(nextGp-curGp))*100 )) : 100;
  return { level: idx+1, name: cur.name||('LV '+(idx+1)), gp, curGp, nextGp, pct, isMax: !next };
}
function levelBarHTML(gp, opts={}){

function nav(route, push=true){

auth.onAuthStateChanged(async (u)=>{
  state.user = u;
  try{
    if(u){
      state.profile = await loadProfile(u.uid);
      if(!state.profile){
        const data = {
          memberId: uid8(), nickname:'', stageName:'', bio:'', dob:'', joinDuration:'',
          cosplayStyles:{}, locationText:'', lat:null, lng:null, points:0, discordPoints:0, photoURL:'',
          phone:'', contactLink:'', characters:[],
          portfolio:[], privacy:'private', status:'ออนไลน์', createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('users').doc(u.uid).set(data);
        state.profile = {id:u.uid, ...data};
      }
      if(state.route === '#/login') state.route = '#/profile';
    } else {
      state.profile = null;
      state.route = '#/login';
    }
  }catch(err){
    console.error('[hijime] auth state load failed', err);
    toast('โหลดข้อมูลผู้ใช้ไม่สำเร็จ กรุณาลองใหม่');
  }
  render();
  // load the rest of the app's shared data (non-blocking, each collection isolated so one failure doesn't break the rest)
  if(u){
    await Promise.allSettled([loadAllUsers(), loadMissions(), loadMissionCats(), loadEvents(), loadWheels(), loadPosts(), loadRewards(), loadDiscordSchedule(), loadMyRedemptions(), loadMyCheckins(), loadBlacklist()]);
    render();
  }
});

function positionNavIndicator(){
  const nav = document.getElementById('bottomNav');
  const ind = document.getElementById('navIndicator');
  if(!nav || !ind) return;
  const active = nav.querySelector('.navbtn.active');
  if(!active){ ind.style.width='0px'; return; }
  const navRect = nav.getBoundingClientRect(), r = active.getBoundingClientRect();
  ind.style.left = (r.left - navRect.left + r.width*0.25) + 'px';
  ind.style.width = (r.width*0.5) + 'px';
}
function floatWidget(){

}

function pageLeaderboard(){
  const tab = state.leaderboardTab || 'gp';
  const field = tab==='gp' ? 'points' : 'discordPoints';
  const ranked = state.allUsers.slice().sort((a,b)=>Number(b[field]||0)-Number(a[field]||0)).filter(u=>Number(u[field]||0)>0);
  const top3 = ranked.slice(0,3);
  const rest = ranked.slice(3,50);
  const podiumOrder = [top3[1], top3[0], top3[2]]; // render 2nd,1st,3rd for podium layout
  const scoreCls = tab==='gp' ? 'gp' : 'pt';
  const coin = tab==='gp' ? '🪙' : '🎧';
  return shell(`
    <div class="card" style="text-align:center;">
      <div style="font-size:28px;">🏆</div>
      <div style="font-weight:800;font-size:16px;margin-top:6px;">กระดานผู้นำ</div>
      <div class="muted" style="font-size:12px;margin-top:2px;">อันดับสมาชิกที่มีแต้มสูงสุดในชุมชน</div>
    </div>
    <div class="lb-tabbar">
      <button class="btn btn-sm ${tab==='gp'?'btn-accent':''}" data-action="filter-leaderboard" data-type="gp">🪙 GP สูงสุด</button>
      <button class="btn btn-sm ${tab==='point'?'btn-accent':''}" data-action="filter-leaderboard" data-type="point">🎧 Point สูงสุด</button>
    </div>
    ${top3.length ? `
    <div class="lb-podium">
      ${podiumOrder.map(u=>{
        if(!u) return `<div class="pod" style="visibility:hidden"></div>`;
        const rank = top3.indexOf(u)+1;
        const crown = rank===1?'👑':(rank===2?'🥈':'🥉');
        return `<div class="pod p${rank}" data-action="view-member" data-id="${u.id}" style="cursor:pointer">
          <div class="pod-crown">${crown}</div>
          <img src="${esc(u.photoURL)||placeholderAvatar()}">
          <div class="pod-name">${esc(u.stageName||u.nickname||'สมาชิก')}</div>
          <div class="pod-score">${Number(u[field]||0).toLocaleString('th-TH')}</div>
        </div>`;
      }).join('')}
    </div>` : ''}
    <div class="card">
      ${rest.length ? rest.map((u,i)=>`
        <div class="lb-row" data-action="view-member" data-id="${u.id}" style="cursor:pointer">
          <div class="lb-rank">#${i+4}</div>
          <img src="${esc(u.photoURL)||placeholderAvatar()}">
          <div class="lb-info">
            <div class="n">${esc(u.stageName||u.nickname||'สมาชิก')}</div>
            <div class="u">UID ${esc(u.memberId||'')}</div>
          </div>
          <div class="lb-score ${scoreCls}">${coin} ${Number(u[field]||0).toLocaleString('th-TH')}</div>
        </div>
      `).join('') : (top3.length ? '' : `<div class="empty">ยังไม่มีข้อมูลอันดับ</div>`)}
    </div>
  `, {title:'กระดานผู้นำ'});
}

const RISK_LABELS = {low:'เสี่ยงต่ำ', medium:'เสี่ยงปานกลาง', high:'เสี่ยงสูง', critical:'อันตรายร้ายแรง'};
const RISK_ICONS = {low:'⚠️', medium:'⚠️', high:'🚫', critical:'☠️'};
function riskBadge(level){
  const lv = RISK_LABELS[level] ? level : 'medium';
  return `<span class="risk-badge risk-${lv}">${RISK_ICONS[lv]} ${RISK_LABELS[lv]}</span>`;
}
function pageBlacklist(){
  const tab = state.blacklistTab || 'trade';
  const items = state.blacklist.filter(b=>(b.type||'trade')===tab);
  const riskOrder = {critical:0, high:1, medium:2, low:3};
  items.sort((a,b)=> (riskOrder[a.riskLevel]??2) - (riskOrder[b.riskLevel]??2));
  return shell(`
    <div class="hazard-strip"></div>
    <div class="danger-header">
      <div class="dh-skull">☠️</div>
      <div class="dh-title">เขตอันตราย — บัญชีดำชุมชน</div>

    ${items.length ? items.map(b=>`
      <div class="bl-card risk-${b.riskLevel||'medium'}">

  `, {title:'บัญชีดำ'});
}

function pageMissionView(id){
  const m = state.missions.find(x=>x.id===id);
  if(!m) return shell(`<div class="empty">ไม่พบภารกิจ</div>`);
  const cat = state.missionCats.find(c=>c.id===m.categoryId);
  const joined = (m.participants||[]).includes(state.user?.uid);
  const participants = (m.participants||[]).map(pid=>state.allUsers.find(u=>u.id===pid)).filter(Boolean);
  return shell(`
    <div class="card">
      ${m.posterURL?`<img class="poster" src="${esc(m.posterURL)}">`:''}
      <div style="font-weight:700;font-size:18px;margin-top:10px;">${esc(m.title)}</div>
      ${cat?`<span class="pill" style="margin-top:6px;">${esc(cat.name)}</span>`:''}
      <div class="muted" style="font-size:12px;margin-top:8px;">ระยะเวลา: ${esc(m.startDate||'')} - ${esc(m.endDate||'')}</div>
      <div style="margin-top:10px;font-size:14px;white-space:pre-wrap;">${esc(m.description||'')}</div>
      <div class="divider"></div>
      <div class="between"><span class="muted" style="font-size:13px;">ของรางวัล</span><b>${m.rewardType==='points'?(m.rewardValue+' แต้ม'):esc(m.rewardValue||'-')}</b></div>
      <div style="margin-top:14px;">
        ${!joined ? `<button class="btn btn-accent btn-block" data-action="join-mission" data-id="${m.id}">เข้าร่วมภารกิจ</button>`
        : `<button class="btn btn-block" data-action="submit-mission" data-id="${m.id}">ส่งภารกิจ / ทำเสร็จแล้ว</button>`}
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">ผู้เข้าร่วมทั้งหมด (${participants.length})</div>
      <div class="grid-members" style="grid-template-columns:1fr 1fr 1fr;">
        ${participants.map(u=>`<div style="text-align:center"><img class="avatar" style="width:44px;height:44px;border-radius:12px;" src="${esc(u.photoURL)||placeholderAvatar()}"><div style="font-size:10px;margin-top:3px;">${esc(u.stageName||u.nickname||'')}</div></div>`).join('') || `<div class="empty" style="grid-column:1/-1">ยังไม่มีผู้เข้าร่วม</div>`}
      </div>
    </div>
  `, {title:'รายละเอียดภารกิจ'});
}

async function loadHistoryInto(){
  if(!state.user) return;
  try{
    const ms = await db.collection('missionHistory').where('uid','==',state.user.uid).orderBy('acceptedAt','desc').limit(30).get();
    const el = document.getElementById('myMissionHistory');
    if(el){
      const rows = ms.docs.map(d=>{
        const h = d.data(); const mm = state.missions.find(x=>x.id===h.missionId);
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
          <div style="font-weight:600;">${esc(mm?mm.title:'ภารกิจ')}</div>
          <div class="muted">รับ: ${fmtDate(h.acceptedAt)} · ส่ง: ${h.submittedAt?fmtDate(h.submittedAt):'ยังไม่ส่ง'} · ${esc(h.status||'')}</div>
        </div>`;
      }).join('');
      el.innerHTML = rows || `<div class="empty">ยังไม่มีประวัติ</div>`;
    }
  }catch(e){
    console.warn(e);
    const el = document.getElementById('myMissionHistory');
    if(el) el.innerHTML = `<div class="empty">${errNote(e,'โหลดประวัติภารกิจไม่สำเร็จ')}</div>`;
  }
  try{
    const sp = await db.collection('spinHistory').where('uid','==',state.user.uid).orderBy('at','desc').limit(30).get();
    const el2 = document.getElementById('mySpinHistory');
    if(el2){
      const rows = sp.docs.map(d=>{
        const h = d.data();
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
          <div style="font-weight:600;">${esc(h.prize)}</div>
          <div class="muted">${fmtDate(h.at)}</div>
        </div>`;
      }).join('');
      el2.innerHTML = rows || `<div class="empty">ยังไม่มีประวัติ</div>`;
    }
  }catch(e){
    console.warn(e);
    const el2 = document.getElementById('mySpinHistory');
    if(el2) el2.innerHTML = `<div class="empty">${errNote(e,'โหลดประวัติวงล้อไม่สำเร็จ')}</div>`;
  }
}

function pageWheel(){
  const wheels = state.wheels;
  const active = wheels.find(w=>w.id===state.activeWheelId) || wheels[0];
  const palette = ['#e7e5df','#c9a24f','#7fae7a','#6d93c9','#c96d7f','#9a9a95','#c9c7c1','#8a7dc9'];
  const prizes = active ? (active.prizes||[]).filter(p=>p.pct>0) : [];
  return shell(`
    <div class="tabbar">
      ${wheels.map(w=>`<button class="btn btn-sm ${active&&active.id===w.id?'btn-accent':''}" data-action="pick-wheel" data-id="${w.id}">${esc(w.name)}</button>`).join('') || ''}
    </div>
    ${active ? `
    <div class="card" style="text-align:center;">
      <div class="wheel-wrap">
        <svg class="wheel-pointer" viewBox="0 0 26 30"><path d="M13 30 L2 8 Q2 0 13 0 Q24 0 24 8 Z" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/></svg>
        <canvas id="wheelCanvas" width="300" height="300" style="max-width:100%;height:auto;"></canvas>
        <div class="wheel-hub" id="wheelHub">🎯</div>
      </div>
      <button class="btn btn-accent btn-block" data-action="spin" data-id="${active.id}" id="spinBtn" style="margin-top:6px;">หมุนวงล้อ</button>
      <div id="spinResult" class="muted" style="margin-top:10px;font-size:13px;min-height:18px;"></div>
      <div class="wheel-legend">
        ${prizes.map((p,i)=>`<div class="item"><span class="swatch" style="background:${palette[i%palette.length]}"></span><span>${esc(p.name||'-')}</span><span class="pct">${p.pct}%</span></div>`).join('') || `<div class="empty">ยังไม่มีของรางวัลในวงล้อนี้</div>`}

function pageRewards(){

    </div>
    <div class="reward-grid">
      ${state.rewards.map(r=>{
        const balance = r.costType==='point' ? Number(p.discordPoints||0) : Number(p.points||0);
        const outOfStock = !(r.stock===null||r.stock===undefined||r.stock==='') && Number(r.stock)<=0;

        return `<div class="reward-card">

          ${r.description?`<div class="muted" style="font-size:11.5px;">${esc(r.description)}</div>`:''}
          <div class="points-badge sm ${r.costType==='point'?'pt':''}"><div class="coin">${r.costType==='point'?'🎧':'🪙'}</div><div class="amt">${Number(r.cost||0).toLocaleString('th-TH')}</div></div>
          <div class="reward-stock">${outOfStock?'ของหมดแล้ว':(r.stock===null||r.stock===undefined||r.stock===''?'ไม่จำกัดจำนวน':'คงเหลือ '+r.stock+' ชิ้น')}</div>
          <button class="btn ${disabled?'':'btn-accent'} btn-block btn-sm" ${disabled?'disabled style="opacity:.45"':''} data-action="redeem-reward" data-id="${r.id}">${outOfStock?'ของหมดแล้ว':(canAfford?'แลกของรางวัล':'แต้มไม่พอ')}</button>
        </div>`;
      }).join('') || `<div class="empty" style="grid-column:1/-1">แอดมินยังไม่ได้เพิ่มของรางวัล</div>`}
    </div>
    <div class="section-title">ประวัติการแลกของฉัน</div>
    ${state.myRedemptions.map(r=>`
      <div class="card">
        <div class="between">
          <div style="font-weight:700;font-size:13px;">${esc(r.rewardName)}</div>
          <span class="pill">${r.status==='มอบแล้ว'?'มอบแล้ว':'รอดำเนินการ'}</span>
        </div>
        <div class="muted" style="font-size:11.5px;margin-top:4px;">${r.cost} ${r.costType==='point'?'Point':'GP'} · ${fmtDate(r.at)}</div>
      </div>
    `).join('') || `<div class="empty">ยังไม่มีประวัติการแลกของรางวัล</div>`}
  `, {title:'แลกของรางวัล'});

function pageDiscord(){
  const p = state.profile || {};
  const c = state.siteConfig;
  const now = new Date();
  return shell(`
    <div class="card">
      <div class="between">
        <div>
          <div class="section-title" style="margin:0 0 4px;">Point ของฉัน</div>
          <div class="points-badge pt"><div class="coin">🎧</div><div><div class="amt">${Number(p.discordPoints||0).toLocaleString('th-TH')}</div><div class="lbl">Point</div></div></div>
        </div>
      </div>
      <div class="muted" style="font-size:12px;margin-top:10px;">เข้าฟัง Discord ตรงเวลา ได้ ${c.discordPtOnTime!=null?c.discordPtOnTime:2} Point · เข้าช้า ได้ ${c.discordPtLate!=null?c.discordPtLate:1} Point</div>
    </div>
    <div class="section-title" style="margin-top:0">กำหนดการเข้าฟัง Discord</div>
    ${state.discordSchedule.slice().sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''))).map(s=>{
      const already = state.myCheckins.find(k=>k.scheduleId===s.id);
      const schedDt = s.date && s.time ? new Date(s.date+'T'+s.time+':00') : null;
      const d = schedDt ? schedDt.getDate() : '-';
      const m = schedDt ? schedDt.toLocaleDateString('th-TH',{month:'short'}) : '';
      let statusHtml = '';
      if(already){
        statusHtml = `<span class="sched-status ${already.status==='ตรงเวลา'?'ontime':'late'}">${esc(already.status)} · +${already.pointsAwarded||0} Point</span>`;
      } else if(schedDt && now < schedDt){
        statusHtml = `<span class="sched-status">ยังไม่ถึงเวลา</span>`;
      } else {
        statusHtml = `<button class="btn btn-sm btn-accent" data-action="checkin-discord" data-id="${s.id}">เช็คอิน</button>`;
      }
      return `<div class="card">
        <div class="sched-row">
          <div class="sched-date"><div class="d">${d}</div><div class="m">${esc(m)}</div></div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13.5px;">${esc(s.title)}</div>
            <div class="muted" style="font-size:11.5px;">${esc(s.date||'')} เวลา ${esc(s.time||'')} น.</div>
          </div>
          ${statusHtml}
        </div>
      </div>`;
    }).join('') || `<div class="empty">แอดมินยังไม่ได้วางกำหนดการ</div>`}
  `, {title:'ระบบ Point (Discord)'});
}

  return shell(`

    <div class="between card" style="margin-top:12px;">

}
function postCard(p){
  const author = state.allUsers.find(u=>u.id===p.uid);
  const uid = state.user && state.user.uid;
  const liked = (p.likes||[]).includes(uid);
  const isOwner = uid===p.uid;
  const commentsOpen = !!state.openComments[p.id];
  const comments = p.comments||[];
  return `
  <div class="card">
    <div class="between">
      <div class="row" style="cursor:pointer" data-action="view-member" data-id="${p.uid}">
        <img class="avatar" style="width:38px;height:38px;border-radius:12px;" src="${esc(author&&author.photoURL)||placeholderAvatar()}">
        <div>
          <div style="font-weight:600;font-size:13px;">${esc((author&&(author.stageName||author.nickname))||'สมาชิก')}</div>
          <div class="muted" style="font-size:11px;">${p.createdAt?fmtDate(p.createdAt):''}</div>
        </div>
      </div>
      ${isOwner ? `<button class="icon-btn" data-action="del-post" data-id="${p.id}" title="ลบโพสต์">✕</button>` : ''}
    </div>
    ${p.category?`<div style="margin-top:10px;"><span class="pill">${esc(p.category)}</span></div>`:''}
    ${p.caption?`<div style="font-size:14px;margin-top:8px;white-space:pre-wrap;">${esc(p.caption)}</div>`:''}
    ${p.imageURL?`<img src="${esc(p.imageURL)}" style="width:100%;border-radius:14px;margin-top:10px;border:1px solid var(--line);max-height:420px;object-fit:cover;">`:''}
    ${p.locationText?`<div class="row muted" style="font-size:12px;margin-top:10px;">${ICONS.pin}<span>${esc(p.locationText)}</span>${(p.lat&&p.lng)?`<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" style="margin-left:auto;text-decoration:underline;">แผนที่</a>`:''}</div>`:''}
    <div class="divider"></div>
    <div class="row" style="gap:18px;">
      <button data-action="toggle-like" data-id="${p.id}" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:${liked?'var(--danger)':'var(--muted)'};font-size:13px;">
        ${liked?ICONS.heartFill:ICONS.heart}<span>${(p.likes||[]).length}</span>
      </button>
      <button data-action="toggle-comments" data-id="${p.id}" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;">
        ${ICONS.comment}<span>${comments.length}</span>
      </button>
    </div>
    ${commentsOpen ? `
    <div class="divider"></div>
    <div>
      ${comments.map(c=>`
        <div class="row" style="align-items:flex-start;margin-bottom:8px;">
          <img class="avatar" style="width:26px;height:26px;border-radius:8px;flex:none;" src="${esc(c.photoURL)||placeholderAvatar()}">
          <div style="font-size:12.5px;"><b>${esc(c.name||'สมาชิก')}</b><div class="muted" style="font-size:11.5px;">${esc(c.text)}</div></div>
        </div>
      `).join('') || `<div class="muted" style="font-size:12px;">ยังไม่มีความคิดเห็น</div>`}
      <div class="row" style="margin-top:8px;">
        <input type="text" id="commentInput-${p.id}" placeholder="เขียนความคิดเห็น..." style="flex:1;">
        <button class="btn btn-sm btn-accent" data-action="send-comment" data-id="${p.id}">ส่ง</button>
      </div>
    </div>` : ''}
  </div>`;
}

function attachPostFormGeoHandler(){
  const btn = document.getElementById('po_geoBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    if(!navigator.geolocation){ toast('อุปกรณ์นี้ไม่รองรับการปักหมุด'); return; }
    document.getElementById('po_geoHint').textContent = 'กำลังค้นหาตำแหน่ง...';
    navigator.geolocation.getCurrentPosition(pos=>{
      window.__postGeo = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      document.getElementById('po_geoHint').textContent = `ปักหมุดแล้ว (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
    }, err=>{
      document.getElementById('po_geoHint').textContent = 'ไม่สามารถเข้าถึงตำแหน่งได้';
    });
  });
}

/* ---------------- wheel drawing/spin ---------------- */
const WHEEL_COLORS = ['#e7e5df','#c9a24f','#7fae7a','#6d93c9','#c96d7f','#9a9a95','#c9c7c1','#8a7dc9'];
function wheelTextColor(hex){
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const luma = (0.299*r+0.587*g+0.114*b)/255;
  return luma > 0.55 ? '#0a0a0a' : '#f2f2ef';
}
function drawWheelCanvas(){
  const wheels = state.wheels;
  const active = wheels.find(w=>w.id===state.activeWheelId) || wheels[0];
  const canvas = document.getElementById('wheelCanvas');
  if(!canvas || !active) return;
  const size = 300, R = size/2 - 6;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size*dpr; canvas.height = size*dpr;
  canvas.style.width = size+'px'; canvas.style.height = size+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const prizes = (active.prizes||[]).filter(p=>p.pct>0);
  const total = prizes.reduce((a,b)=>a+Number(b.pct||0),0) || 1;
  let start = state.wheelRotation || 0;
  function paint(rot){
    ctx.clearRect(0,0,size,size);
    ctx.save(); ctx.translate(size/2,size/2);
    // outer rim
    ctx.beginPath(); ctx.arc(0,0,R+4,0,Math.PI*2); ctx.fillStyle='#0a0a0a'; ctx.fill();
    ctx.rotate(rot);
    let ang = -Math.PI/2;
    prizes.forEach((p,i)=>{
      const slice = (p.pct/total)*Math.PI*2;
      const color = WHEEL_COLORS[i%WHEEL_COLORS.length];
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,R,ang,ang+slice); ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle = '#0a0a0a'; ctx.stroke();
      // label
      ctx.save(); ctx.rotate(ang+slice/2);
      ctx.textBaseline='middle'; ctx.fillStyle = wheelTextColor(color);
      ctx.font = '700 13px Prompt, "Noto Sans Thai", sans-serif';
      let label = (p.name||'').trim();
      const maxChars = slice < 0.35 ? 8 : 14;
      if(label.length>maxChars) label = label.slice(0,maxChars-1)+'…';
      ctx.fillText(label, 30, 4, R-46);
      ctx.restore();
      ang += slice;
    });
    ctx.restore();
  }
  paint(start);
  canvas.__paint = paint; canvas.__prizes = prizes; canvas.__total = total;
}
let spinning = false;
async function doSpin(wheelId){
  if(spinning) return;
  const canvas = document.getElementById('wheelCanvas');
  const resEl = document.getElementById('spinResult');
  const hub = document.getElementById('wheelHub');
  if(!canvas || !canvas.__prizes || !canvas.__prizes.length){ toast('วงล้อนี้ยังไม่มีของรางวัล'); return; }
  spinning = true;
  if(hub) hub.classList.add('spinning');
  resEl.textContent='';
  const prizes = canvas.__prizes, total = canvas.__total;
  let r = Math.random()*total, acc=0, chosen=prizes[0], chosenIdx=0;
  for(let i=0;i<prizes.length;i++){ acc+=Number(prizes[i].pct||0); if(r<=acc){chosen=prizes[i]; chosenIdx=i; break;} }
  // compute target angle so pointer (top) lands mid-slice of chosen
  let ang=0; for(let i=0;i<chosenIdx;i++) ang += (prizes[i].pct/total)*Math.PI*2;
  const mid = ang + (prizes[chosenIdx].pct/total)*Math.PI; // slice midpoint from start(-90deg offset baked in paint)
  const targetRot = Math.PI*2*6 - mid; // spin 6 extra turns, land so slice sits at top pointer
  const startTime = performance.now(); const dur = 3800; const startRot = state.wheelRotation||0;
  function frame(t){
    const p = Math.min(1,(t-startTime)/dur);
    const ease = 1-Math.pow(1-p,3);
    const rot = startRot + (targetRot-startRot)*ease;
    canvas.__paint(rot);
    if(p<1) requestAnimationFrame(frame);
    else{
      state.wheelRotation = targetRot % (Math.PI*2);
      spinning = false;
      if(hub) hub.classList.remove('spinning');
      resEl.textContent = 'คุณได้รับ: ' + (chosen.name||'-');
      toast('ยินดีด้วย! ได้ ' + (chosen.name||'-'));
      if(state.user){
        db.collection('spinHistory').add({uid:state.user.uid, wheelId, prize:chosen.name, at: firebase.firestore.FieldValue.serverTimestamp()}).catch(err=>{ console.error(err); toast('บันทึกประวัติการหมุนไม่สำเร็จ'); });
      }
    }
  }
  requestAnimationFrame(frame);
}

function extractIndexLink(err){
  const msg = (err && (err.message||err.code||'')) || '';
  const m = String(msg).match(/https:\/\/console\.firebase\.google\.com\S+/);
  return m ? m[0] : null;
}
function errNote(err, fallback){
  const link = extractIndexLink(err);
  if(link) return `${fallback} — ต้องสร้าง Firestore Index ก่อนใช้งานได้: <a href="${link}" target="_blank" rel="noopener" style="text-decoration:underline;color:var(--accent)">คลิกเพื่อสร้าง Index</a>`;
  return fallback + (err && (err.message||err.code) ? ' ('+(err.message||err.code)+')' : '');
}
function translateAuthErr(err){
  const m = {
    'auth/email-already-in-use':'อีเมลนี้ถูกใช้แล้ว',
    'auth/invalid-email':'อีเมลไม่ถูกต้อง',
    'auth/weak-password':'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัว)',
    'auth/wrong-password':'รหัสผ่านไม่ถูกต้อง',
    'auth/user-not-found':'ไม่พบบัญชีนี้',
    'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
  };
  return m[err.code] || err.message;
}

  if(action==='goto'){ nav(t.dataset.route); return; }
  if(action==='toggle-float'){ state.floatOpen = !state.floatOpen; render(); return; }
  if(action==='toggle-pw'){
    const inp = document.getElementById(t.dataset.target);
    if(inp){ inp.type = inp.type==='password' ? 'text' : 'password'; }
    return;
  }
  if(action==='close-modal'){ if(e.target===t){ state.modal=null; render(); } return; }
  if(action==='logout'){ await auth.signOut(); return; }
  if(action==='admin-logout'){ state.adminAuthed=false; sessionStorage.removeItem('hijime_admin'); nav('#/profile', false); return; }

  if(action==='edit-profile'){ state.editCharacters = ((state.profile&&state.profile.characters)||[]).slice(); state.modal = editProfileModal(); render(); attachAuthTabHandlersIfNeeded(); return; }
  if(action==='add-character'){
    const inp = document.getElementById('f_newCharacter');
    const name = (inp.value||'').trim();
    if(!name) return;
    state.editCharacters = (state.editCharacters||[]).concat([name]);
    state.modal = editProfileModal(); render();
    return;
  }
  if(action==='remove-character'){
    const i = Number(t.dataset.i);
    state.editCharacters = (state.editCharacters||[]); state.editCharacters.splice(i,1);
    state.modal = editProfileModal(); render();
    return;
  }
  if(action==='add-portfolio'){ state.modal = portfolioModal(); render(); return; }
  if(action==='add-post'){ state.modal = postFormModal(); window.__postGeo=null; render(); attachPostFormGeoHandler(); return; }
  if(action==='toggle-like'){
    const id = t.dataset.id;
    const p = state.posts.find(x=>x.id===id); if(!p) return;
    const uid = state.user.uid;
    const liked = (p.likes||[]).includes(uid);
    const ref = db.collection('posts').doc(id);
    if(liked){
      p.likes = (p.likes||[]).filter(x=>x!==uid);
      ref.update({likes: firebase.firestore.FieldValue.arrayRemove(uid)}).catch(console.warn);
    } else {
      p.likes = (p.likes||[]).concat([uid]);
      ref.update({likes: firebase.firestore.FieldValue.arrayUnion(uid)}).catch(console.warn);
    }
    render(); return;
  }
  if(action==='toggle-comments'){ const id=t.dataset.id; state.openComments[id] = !state.openComments[id]; render(); return; }
  if(action==='send-comment'){
    const id = t.dataset.id;
    const inp = document.getElementById('commentInput-'+id);
    const text = (inp.value||'').trim();
    if(!text) return;
    const p = state.profile||{};
    const comment = {uid:state.user.uid, name:p.stageName||p.nickname||'สมาชิก', photoURL:p.photoURL||'', text, at: firebase.firestore.Timestamp.now()};
    const post = state.posts.find(x=>x.id===id); if(!post) return;
    post.comments = (post.comments||[]).concat([comment]);
    inp.value='';
    render();
    db.collection('posts').doc(id).update({comments: firebase.firestore.FieldValue.arrayUnion(comment)}).catch(console.warn);
    return;
  }
  if(action==='del-post'){
    const id = t.dataset.id;
    db.collection('posts').doc(id).delete().catch(console.warn);
    state.posts = state.posts.filter(x=>x.id!==id);
    render(); toast('ลบโพสต์แล้ว'); return;
  }
  if(action==='del-portfolio'){
    const i = Number(t.dataset.i);
    const portfolio = (state.profile.portfolio||[]).slice(); portfolio.splice(i,1);
    await db.collection('users').doc(state.user.uid).update({portfolio});
    state.profile.portfolio = portfolio; render(); toast('ลบผลงานแล้ว'); return;
  }
  if(action==='view-member'){ nav('#/member:'+t.dataset.id); return; }
  if(action==='filter-mission'){ state.missionFilter = t.dataset.cat || null; render(); return; }
  if(action==='view-mission'){ nav('#/mission:'+t.dataset.id); return; }
  if(action==='goto-mission-from-event'){ nav('#/mission:'+t.dataset.id); return; }
  if(action==='join-mission'){
    const id = t.dataset.id;
    const m = state.missions.find(x=>x.id===id);
    if(!m){ toast('ไม่พบภารกิจนี้'); return; }
    if((m.participants||[]).includes(state.user.uid)){ toast('คุณเข้าร่วมภารกิจนี้แล้ว'); return; }
    const participants = (m.participants||[]).concat([state.user.uid]);
    await db.collection('missions').doc(id).update({participants});
    m.participants = participants;
    await db.collection('missionHistory').add({uid:state.user.uid, missionId:id, acceptedAt:firebase.firestore.FieldValue.serverTimestamp(), status:'กำลังทำ'});
    render(); toast('เข้าร่วมภารกิจแล้ว'); return;
  }
  if(action==='submit-mission'){
    const id = t.dataset.id;
    try{
      const q = await db.collection('missionHistory').where('uid','==',state.user.uid).where('missionId','==',id).orderBy('acceptedAt','desc').limit(1).get();
      if(!q.empty){
        await q.docs[0].ref.update({submittedAt:firebase.firestore.FieldValue.serverTimestamp(), status:'ส่งแล้ว'});
        toast('ส่งภารกิจแล้ว รอตรวจสอบ');
      }
    }catch(err){ console.warn(err); toast(errNote(err,'ส่งภารกิจไม่สำเร็จ')); }
    return;
  }
  if(action==='filter-leaderboard'){ state.leaderboardTab = t.dataset.type; render(); return; }
  if(action==='filter-blacklist'){ state.blacklistTab = t.dataset.type; render(); return; }
  if(action==='pick-wheel'){ state.activeWheelId = t.dataset.id; state.wheelRotation=0; render(); return; }
  if(action==='spin'){ doSpin(t.dataset.id); return; }
  if(action==='redeem-reward'){
    const id = t.dataset.id;
    const r = state.rewards.find(x=>x.id===id);
    if(!r){ toast('ไม่พบของรางวัลนี้'); return; }
    const p = state.profile||{};
    const field = r.costType==='point' ? 'discordPoints' : 'points';
    const balance = Number(p[field]||0);
    const cost = Number(r.cost||0);
    if(balance < cost){ toast('แต้มไม่พอสำหรับแลกของรางวัลนี้'); return; }
    if(!(r.stock===null||r.stock===undefined) && Number(r.stock)<=0){ toast('ของรางวัลนี้หมดแล้ว'); return; }
    try{
      await db.runTransaction(async (tx)=>{
        const userRef = db.collection('users').doc(state.user.uid);
        const rewardRef = db.collection('rewards').doc(id);
        const [userSnap, rewardSnap] = await Promise.all([tx.get(userRef), tx.get(rewardRef)]);
        const uData = userSnap.data()||{};
        const rData = rewardSnap.data()||{};
        const curBal = Number(uData[field]||0);
        if(curBal < cost) throw new Error('แต้มไม่พอ');
        const hasStock = !(rData.stock===null||rData.stock===undefined);
        if(hasStock){
          if(Number(rData.stock)<=0) throw new Error('ของหมดแล้ว');
          tx.update(rewardRef, {stock: Number(rData.stock)-1});
        }
        tx.update(userRef, {[field]: curBal - cost});
        const redemptionRef = db.collection('redemptions').doc();
        tx.set(redemptionRef, {
          uid: state.user.uid, rewardId: id, rewardName: rData.name||r.name,
          cost, costType: r.costType, status:'รอดำเนินการ', at: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      state.profile[field] = Number(state.profile[field]||0) - cost;
      if(!(r.stock===null||r.stock===undefined)) r.stock = Number(r.stock)-1;
      await loadMyRedemptions();
      render(); toast('แลกของรางวัลสำเร็จ! รอแอดมินติดต่อมอบของรางวัล');
    }catch(err){ console.error(err); toast(errNote(err,'แลกของรางวัลไม่สำเร็จ')); }
    return;
  }
  if(action==='checkin-discord'){
    const id = t.dataset.id;
    const s = state.discordSchedule.find(x=>x.id===id);
    if(!s){ toast('ไม่พบกำหนดการนี้'); return; }
    if(state.myCheckins.find(k=>k.scheduleId===id)){ toast('คุณเช็คอินกำหนดการนี้ไปแล้ว'); return; }
    const schedDt = s.date && s.time ? new Date(s.date+'T'+s.time+':00') : new Date();
    const grace = Number(state.siteConfig.discordGraceMinutes!=null?state.siteConfig.discordGraceMinutes:15);
    const deadline = new Date(schedDt.getTime() + grace*60000);
    const now = new Date();
    const onTime = now <= deadline;
    const pts = onTime ? Number(state.siteConfig.discordPtOnTime!=null?state.siteConfig.discordPtOnTime:2)
                       : Number(state.siteConfig.discordPtLate!=null?state.siteConfig.discordPtLate:1);
    const status = onTime ? 'ตรงเวลา' : 'สายเวลา';
    try{
      const checkinData = { uid: state.user.uid, scheduleId: id, status, pointsAwarded: pts, checkedAt: firebase.firestore.FieldValue.serverTimestamp() };
      await db.collection('discordCheckins').add(checkinData);
      await db.collection('users').doc(state.user.uid).update({discordPoints: firebase.firestore.FieldValue.increment(pts)});
      state.profile.discordPoints = Number(state.profile.discordPoints||0) + pts;
      state.myCheckins.push({...checkinData, checkedAt:{seconds: Math.floor(Date.now()/1000)}});
      render(); toast(`เช็คอินสำเร็จ! ${status} ได้ ${pts} Point`);
    }catch(err){ console.error(err); toast(errNote(err,'เช็คอินไม่สำเร็จ')); }
    return;
  }

  // admin
  if(action==='admin-tab'){
    state.adminTab = t.dataset.tab;
    document.querySelectorAll('#adminTabs .btn').forEach(b=>{b.classList.remove('btn-accent');});
    t.classList.add('btn-accent');
    const body = document.getElementById('adminBody');
    body.style.animation='none'; body.offsetHeight; body.style.animation='pageIn .3s cubic-bezier(.2,.8,.2,1) both';
    body.innerHTML = adminTabBody(state.adminTab);
    body.querySelectorAll('.card').forEach((el,i)=>{ el.style.animationDelay = Math.min(i*0.045,0.4)+'s'; });
    if(state.adminTab==='levels') attachLevelRowHandler();
    return;
  }
  if(action==='save-site'){
    const data = { siteName:$('#a_siteName').value, accent:$('#a_accent').value, adminUser:$('#a_adminUser').value, adminPass:$('#a_adminPass').value };
    const file = document.getElementById('a_logoFile').files[0];
    if(file){ toast('กำลังอัปโหลดโลโก้...'); data.logoURL = await uploadImage(file, 'site/logo', 300); }
    await db.collection('siteConfig').doc('main').set(data, {merge:true});
    state.siteConfig = Object.assign(state.siteConfig, data); applyTheme(); render(); toast('บันทึกการตั้งค่าแล้ว'); return;
  }
  if(action==='save-member'){
    const id = t.dataset.id;
    const points = Number(document.querySelector(`.m_points[data-id="${id}"]`).value||0);
    const discordPoints = Number(document.querySelector(`.m_discordPoints[data-id="${id}"]`).value||0);
    const status = document.querySelector(`.m_status[data-id="${id}"]`).value;
    await db.collection('users').doc(id).update({points, discordPoints, status});
    const u = state.allUsers.find(x=>x.id===id); if(u){u.points=points; u.discordPoints=discordPoints; u.status=status;}
    toast('บันทึกแล้ว'); return;
  }
  if(action==='add-cat'){
    const name = document.getElementById('newCatName').value.trim();
    if(!name) return;
    await db.collection('missionCategories').add({name});
    await loadMissionCats(); document.getElementById('adminBody').innerHTML = adminTabBody('cats'); return;
  }
  if(action==='save-cat'){
    const id = t.dataset.id;
    const name = document.querySelector(`.cat_name[data-id="${id}"]`).value.trim();
    if(!name) return;
    await db.collection('missionCategories').doc(id).update({name});
    await loadMissionCats(); toast('บันทึกหมวดหมู่แล้ว'); return;
  }
  if(action==='admin-del-post'){
    await db.collection('posts').doc(t.dataset.id).delete();
    await loadPosts(); document.getElementById('adminBody').innerHTML = adminTabBody('posts'); toast('ลบโพสต์แล้ว'); return;
  }
  if(action==='del-cat'){ await db.collection('missionCategories').doc(t.dataset.id).delete(); await loadMissionCats(); document.getElementById('adminBody').innerHTML = adminTabBody('cats'); return; }
  if(action==='new-mission'){ state.editingMission=null; state.modal = missionFormModal(null); render(); return; }
  if(action==='edit-mission'){ const m = state.missions.find(x=>x.id===t.dataset.id); state.editingMission=m; state.modal = missionFormModal(m); render(); return; }
  if(action==='del-mission'){ await db.collection('missions').doc(t.dataset.id).delete(); await loadMissions(); document.getElementById('adminBody').innerHTML = adminTabBody('missions'); return; }
  if(action==='new-event'){ state.editingEvent=null; state.modal = eventFormModal(null); render(); return; }
  if(action==='edit-event'){ const ev = state.events.find(x=>x.id===t.dataset.id); state.editingEvent=ev; state.modal = eventFormModal(ev); render(); return; }
  if(action==='del-event'){ await db.collection('events').doc(t.dataset.id).delete(); await loadEvents(); document.getElementById('adminBody').innerHTML = adminTabBody('events'); return; }
  if(action==='new-wheel'){ state.modal = wheelFormModal(null); render(); attachPrizeRowHandler(); return; }
  if(action==='edit-wheel'){ const w = state.wheels.find(x=>x.id===t.dataset.id); state.modal = wheelFormModal(w); render(); attachPrizeRowHandler(); return; }
  if(action==='del-wheel'){ await db.collection('wheels').doc(t.dataset.id).delete(); await loadWheels(); document.getElementById('adminBody').innerHTML = adminTabBody('wheels'); return; }

  if(action==='new-reward'){ state.editingReward=null; state.modal = rewardFormModal(null); render(); return; }
  if(action==='edit-reward'){ const r = state.rewards.find(x=>x.id===t.dataset.id); state.editingReward=r; state.modal = rewardFormModal(r); render(); return; }
  if(action==='del-reward'){ await db.collection('rewards').doc(t.dataset.id).delete(); await loadRewards(); document.getElementById('adminBody').innerHTML = adminTabBody('rewards'); toast('ลบของรางวัลแล้ว'); return; }
  if(action==='mark-redeemed'){
    const id = t.dataset.id;
    await db.collection('redemptions').doc(id).update({status:'มอบแล้ว'});
    const r = state.allRedemptions.find(x=>x.id===id); if(r) r.status='มอบแล้ว';
    document.getElementById('adminBody').innerHTML = adminTabBody('rewards'); toast('บันทึกแล้ว'); return;
  }
  if(action==='new-discord-schedule'){ state.modal = discordScheduleFormModal(null); render(); return; }
  if(action==='edit-discord-schedule'){ const s = state.discordSchedule.find(x=>x.id===t.dataset.id); state.modal = discordScheduleFormModal(s); render(); return; }
  if(action==='del-discord-schedule'){ await db.collection('discordSchedule').doc(t.dataset.id).delete(); await loadDiscordSchedule(); document.getElementById('adminBody').innerHTML = adminTabBody('discord'); toast('ลบกำหนดการแล้ว'); return; }
  if(action==='save-discord-settings'){
    const data = {
      discordPtOnTime: Number(document.getElementById('a_ptOnTime').value||0),
      discordPtLate: Number(document.getElementById('a_ptLate').value||0),
      discordGraceMinutes: Number(document.getElementById('a_ptGrace').value||0)
    };
    await db.collection('siteConfig').doc('main').set(data, {merge:true});
    Object.assign(state.siteConfig, data); toast('บันทึกการตั้งค่าแล้ว'); return;
  }
  if(action==='admin-blacklist-tab'){
    state.adminBlacklistTab = t.dataset.type;
    document.getElementById('adminBody').innerHTML = adminTabBody('blacklist');
    return;
  }
  if(action==='new-blacklist'){ state.editingBlacklist=null; state.modal = blacklistFormModal(null, t.dataset.type); render(); return; }
  if(action==='edit-blacklist'){ const b = state.blacklist.find(x=>x.id===t.dataset.id); state.editingBlacklist=b; state.modal = blacklistFormModal(b); render(); return; }
  if(action==='del-blacklist'){ await db.collection('blacklist').doc(t.dataset.id).delete(); await loadBlacklist(); document.getElementById('adminBody').innerHTML = adminTabBody('blacklist'); toast('ลบรายชื่อออกจากบัญชีดำแล้ว'); return; }
  if(action==='save-levels'){
    const rows = Array.from(document.querySelectorAll('.levelRow')).map(row=>({
      name: row.querySelector('.lv_name').value, gp: Number(row.querySelector('.lv_gp').value||0)
    })).filter(l=>l.name);
    rows.sort((a,b)=>a.gp-b.gp);
    await db.collection('siteConfig').doc('main').set({levels: rows}, {merge:true});
    state.siteConfig.levels = rows; render(); attachLevelRowHandler(); toast('บันทึกตารางเลเวลแล้ว'); return;
  }

  }catch(err){
    console.error('[hijime] action error:', action, err);
    toast(errNote(err,'เกิดข้อผิดพลาด'));
  }
});
function attachPrizeRowHandler(){
  const btn = document.getElementById('addPrizeRow');
  if(btn) btn.addEventListener('click', ()=>{
    document.getElementById('prizeRows').insertAdjacentHTML('beforeend', prizeRow({name:'',pct:0}));
  });
}
function attachLevelRowHandler(){
  const btn = document.getElementById('addLevelRow');
  if(btn) btn.addEventListener('click', ()=>{
    document.getElementById('levelRows').insertAdjacentHTML('beforeend', levelRow({name:'',gp:0}));
  });
}
document.addEventListener('click', (e)=>{
  const tab = e.target.closest('#authTabs button');
  if(tab){
    document.querySelectorAll('#authTabs button').forEach(b=>{b.classList.remove('btn-accent');b.classList.add('btn-ghost');});
    tab.classList.add('btn-accent'); tab.classList.remove('btn-ghost');
    document.getElementById('authSubmit').textContent = tab.dataset.tab==='register' ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  }
});
function attachAuthTabHandlersIfNeeded(){}

/* ---------------- boot ---------------- */
async function boot(){
  await loadSiteConfig();
  render();
  if(state.adminAuthed){
    await Promise.allSettled([loadAllUsers(), loadPosts(), loadMissions(), loadMissionCats(), loadEvents(), loadWheels(), loadRewards(), loadDiscordSchedule(), loadAllRedemptions(), loadBlacklist()]);
    render();
  }
  const splash = document.getElementById('bootSplash');
  if(splash) splash.classList.add('hide');
}
boot();
</script>
</body>
</html>
