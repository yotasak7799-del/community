<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hijime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#0a0a0a; --bg2:#111111; --surface:#161616; --surface2:#1e1e1e;
  --line:#2a2a2a; --text:#f2f2ef; --muted:#9a9a95; --accent:#e7e5df;
  --accent-text:#0a0a0a; --danger:#c94f4f; --good:#7fae7a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Prompt','Noto Sans Thai',sans-serif; -webkit-font-smoothing:antialiased;
  letter-spacing:.005em;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:-webkit-fill-available;}
body{min-height:100dvh; min-height:-webkit-fill-available;}
h1,h2,h3,.disp{font-family:'Prompt','Noto Sans Thai',sans-serif; font-weight:600; letter-spacing:.01em;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

#frame{
  max-width:430px; margin:0 auto; min-height:100dvh;
  background:linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
  position:relative; display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
.topbar{
  position:sticky; top:0; z-index:30;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(10,10,10,.72); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px;
  animation:barIn .35s ease both;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface); color:var(--text); display:flex; align-items:center;
  justify-content:center; flex:none; transition:.18s cubic-bezier(.2,.8,.2,1);
}
.back-btn:hover{background:var(--surface2); border-color:#3a3a3a; transform:translateX(-2px)}
.back-btn:active{transform:scale(.9)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.brand-mark{width:28px;height:28px;border-radius:8px;flex:none;background:linear-gradient(145deg,var(--accent),#8a8880);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent-text);letter-spacing:0;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.brand-name{font-weight:700;letter-spacing:.02em;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);transition:.18s cubic-bezier(.2,.8,.2,1)}
.icon-btn:hover{background:var(--surface2);border-color:#444}
.icon-btn:active{transform:scale(.88)}

main{flex:1; padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px)); overflow-x:hidden;}
#pageContent{animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;}
@keyframes pageIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
@keyframes barIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)}}
@keyframes cardIn{from{opacity:0; transform:translateY(8px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 6px 20px rgba(0,0,0,.25);
  position:relative; overflow:hidden; transition:border-color .2s, transform .15s; animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);}
.card:active{transform:scale(.99)}
main .card:nth-of-type(1){animation-delay:.02s}
main .card:nth-of-type(2){animation-delay:.06s}
main .card:nth-of-type(3){animation-delay:.1s}
main .card:nth-of-type(4){animation-delay:.14s}
.card + .card{margin-top:12px}
.section-title{font-size:13px; color:var(--muted); letter-spacing:.04em; margin:18px 2px 8px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-weight:600; font-size:14px; transition:transform .15s cubic-bezier(.2,.8,.2,1), border-color .15s, box-shadow .15s;}
.btn:hover{border-color:#444; transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-accent{background:var(--accent); color:var(--accent-text); border-color:var(--accent); box-shadow:0 4px 14px rgba(231,229,223,.15);}
.btn-accent:active{box-shadow:0 2px 6px rgba(231,229,223,.1);}
.btn-block{width:100%}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--text); font-size:14px; outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical; min-height:80px}
label{font-size:12px; color:var(--muted); display:block; margin:12px 0 6px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pill{display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); font-size:12px; color:var(--muted); transition:.15s}
.pill.on{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
.char-pill{display:inline-flex; align-items:center; gap:6px; padding:6px 8px 6px 14px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); font-size:12.5px; margin:0 6px 6px 0; animation:cardIn .25s cubic-bezier(.2,.8,.2,1) both;}
.char-pill button{width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.char-pill button:hover{background:var(--danger);color:#fff}
.char-add-row{display:flex;gap:8px;margin-top:8px;}
.char-add-row input{flex:1}
.avatar{width:74px;height:74px;border-radius:22px;object-fit:cover;background:var(--surface2); border:1px solid var(--line);}
.avatar-lg{width:104px;height:104px;border-radius:28px;}
.muted{color:var(--muted)}
.row{display:flex; align-items:center; gap:12px}
.between{display:flex; align-items:center; justify-content:space-between}
.divider{height:1px;background:var(--line); margin:14px 0}
.poster{width:100%; aspect-ratio:1546/423; object-fit:cover; border-radius:14px; background:var(--surface2); border:1px solid var(--line);}
.badge-num{font-variant-numeric:tabular-nums; letter-spacing:.06em;}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px) scale(.95); background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transition:opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
.bottomnav{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%);
  width:100%; max-width:430px; z-index:40; display:flex; border-top:1px solid var(--line);
  background:rgba(10,10,10,.85); backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.navbtn{flex:1; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:10.5px; border:none; background:transparent; position:relative; transition:color .2s, transform .15s;}
.navbtn.active{color:var(--text)}
.navbtn:active{transform:scale(.92)}
.navbtn svg{width:20px;height:20px; transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.navbtn.active svg{transform:translateY(-1px) scale(1.08);}
.nav-indicator{position:absolute; top:0; height:2px; background:var(--accent); border-radius:2px;
  transition:left .3s cubic-bezier(.34,1.2,.4,1), width .3s cubic-bezier(.34,1.2,.4,1);}
.float-status{
  position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); right:calc((100% - 430px)/2 + 12px);
  z-index:50; max-width:220px;
}
@media (max-width:460px){.float-status{right:12px}}
.float-toggle{
  width:40px;height:40px;border-radius:50%;background:rgba(30,30,30,.5); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center;
  color:var(--muted); float:right; transition:transform .2s cubic-bezier(.34,1.56,.64,1), color .2s;
}
.float-toggle:active{transform:scale(.88)}
.float-toggle.on{color:var(--text); transform:rotate(180deg);}
.float-panel{
  margin-top:8px; background:rgba(22,22,22,.55); backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px; max-height:220px; overflow:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.35); transform-origin:top right;
  animation:floatPanelIn .22s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes floatPanelIn{from{opacity:0; transform:scale(.9) translateY(-6px)} to{opacity:1; transform:scale(1) translateY(0)}}
.float-panel .item{display:flex;align-items:center;gap:8px;padding:6px 4px; font-size:12px;}
.dot{width:7px;height:7px;border-radius:50%;background:#666; flex:none}
.dot.online{background:#7fae7a}
.dot.busy{background:#c9a24f}
.dot.off{background:#555}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;
  animation:backdropIn .22s ease both; backdrop-filter:blur(2px);}
@keyframes backdropIn{from{opacity:0} to{opacity:1}}
@keyframes sheetIn{from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:translateY(0)}}
.modal{width:100%; max-width:430px; background:var(--surface); border:1px solid var(--line); border-radius:22px 22px 0 0; padding:10px 18px 20px; max-height:88vh; overflow:auto;
  animation:sheetIn .32s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 -10px 40px rgba(0,0,0,.45);}
.modal-handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px;}
.modal-top{background:var(--surface); border-radius:0 0 20px 20px; align-self:flex-start; margin-top:0;}
.grid-members{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.member-card{background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s;}
.member-card:active{transform:scale(.95); border-color:#444;}
.member-card img{width:56px;height:56px;border-radius:16px;object-fit:cover; margin-bottom:6px;}
.wheel-wrap{position:relative; display:flex; justify-content:center; margin:10px 0;}
.wheel-pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); font-size:22px; z-index:5;}
.empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:13px;}
.tag-input{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag-input .pill{cursor:pointer}
.login-wrap{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;}
.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.tabbar button{white-space:nowrap;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid #555;border-top-color:var(--text);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11px;color:var(--muted); margin-top:4px;}
fieldset{border:1px solid var(--line); border-radius:12px; margin:12px 0; padding:10px;}
legend{padding:0 6px; font-size:12px; color:var(--muted);}
.status-select{width:auto; display:inline-block; padding:6px 10px; font-size:12px;}
.footer-admin{padding:30px 16px 50px; text-align:center;}
.footer-admin summary{cursor:pointer; color:var(--muted); font-size:12px; list-style:none;}
.footer-admin summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="frame">
  <div id="app"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- Firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBPUymXk4LkiELJnIp3I8w4nzM5CD8NQ88",
  authDomain: "community-cm-779f9.firebaseapp.com",
  projectId: "community-cm-779f9",
  storageBucket: "community-cm-779f9.firebasestorage.app",
  messagingSenderId: "875179230791",
  appId: "1:875179230791:web:84a1da013d8330ecac1362",
  measurementId: "G-MVKL3LSWWK"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let storage = null;
try{ storage = firebase.storage(); }catch(e){ console.warn('storage unavailable', e); }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>t.classList.remove('show'), 2200);
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid8(){ return String(Math.floor(10000000+Math.random()*89999999)); }
function fmtDate(ts){
  if(!ts) return '-';
  let d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function calcAge(dob){
  if(!dob) return '-';
  const b = new Date(dob), n = new Date();
  let a = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  return a;
}
function fileToResizedDataURL(file, maxW){
  return new Promise((res,rej)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
async function uploadImage(file, path, maxW){
  const dataUrl = await fileToResizedDataURL(file, maxW || 1000);
  if(storage){
    try{
      const ref = storage.ref().child(path + '_' + Date.now() + '.jpg');
      await ref.putString(dataUrl, 'data_url');
      return await ref.getDownloadURL();
    }catch(e){ console.warn('storage upload failed, falling back to inline', e); }
  }
  return dataUrl; // fallback: store the data URL itself
}

const COSPLAY_STYLES = ["อนิเมะ/มังงะ","เกม","ออริจินัลคาแรกเตอร์","ประวัติศาสตร์/ย้อนยุค","ภาพยนตร์/ซีรีส์","แฟนตาซี/ครีเจอร์"];

/* ---------------- state ---------------- */
let state = {
  user:null, profile:null, route:'#/login', stack:[],
  siteConfig:{siteName:'Hijime', logoURL:'', accent:'#e7e5df', adminUser:'admin', adminPass:'test'},
  adminAuthed: sessionStorage.getItem('hijime_admin')==='1',
  allUsers:[], missions:[], missionCats:[], events:[], wheels:[], posts:[],
  floatOpen:false, openComments:{}
};

function applyTheme(){
  document.documentElement.style.setProperty('--accent', state.siteConfig.accent || '#e7e5df');
}

function nav(route, push=true){
  if(push && state.route) state.stack.push(state.route);
  state.route = route;
  render();
  window.scrollTo(0,0);
}
function back(){
  const prev = state.stack.pop();
  state.route = prev || (state.user ? '#/profile' : '#/login');
  render();
  window.scrollTo(0,0);
}

/* ---------------- data loaders ---------------- */
async function loadSiteConfig(){
  try{
    const d = await db.collection('siteConfig').doc('main').get();
    if(d.exists) state.siteConfig = Object.assign(state.siteConfig, d.data());
    else await db.collection('siteConfig').doc('main').set(state.siteConfig);
  }catch(e){ console.warn('siteConfig load failed', e); }
  applyTheme();
}
async function loadProfile(uid){
  const d = await db.collection('users').doc(uid).get();
  if(d.exists) return {id:d.id, ...d.data()};
  return null;
}
async function loadAllUsers(){
  const snap = await db.collection('users').get();
  state.allUsers = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadMissions(){
  const snap = await db.collection('missions').orderBy('createdAt','desc').get();
  state.missions = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadMissionCats(){
  const snap = await db.collection('missionCategories').get();
  state.missionCats = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadEvents(){
  const snap = await db.collection('events').orderBy('createdAt','desc').get();
  state.events = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadWheels(){
  const snap = await db.collection('wheels').get();
  state.wheels = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadPosts(){
  const snap = await db.collection('posts').orderBy('createdAt','desc').get();
  state.posts = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

/* ---------------- auth ---------------- */
auth.onAuthStateChanged(async (u)=>{
  state.user = u;
  if(u){
    state.profile = await loadProfile(u.uid);
    if(!state.profile){
      const data = {
        memberId: uid8(), nickname:'', stageName:'', bio:'', dob:'', joinDuration:'',
        cosplayStyles:{}, locationText:'', lat:null, lng:null, points:0, photoURL:'',
        phone:'', contactLink:'', characters:[],
        portfolio:[], privacy:'private', status:'ออนไลน์', createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('users').doc(u.uid).set(data);
      state.profile = {id:u.uid, ...data};
    }
    if(state.route === '#/login') state.route = '#/profile';
  } else {
    state.profile = null;
    state.route = '#/login';
  }
  render();
});

/* ---------------- top bar / shell ---------------- */
function shell(inner, opts={}){
  const showBack = state.stack.length>0 && opts.back!==false;
  const title = opts.title || '';
  return `
  <div class="topbar">
    ${showBack ? `<button class="back-btn" data-action="back">${ICONS.back}</button>` : `<div style="width:36px"></div>`}
    <div class="brand">
      ${state.siteConfig.logoURL ? `<img src="${esc(state.siteConfig.logoURL)}">` : `<div class="brand-mark">${esc((state.siteConfig.siteName||'H').trim().charAt(0).toUpperCase())}</div>`}
      <div class="brand-name">${esc(title || state.siteConfig.siteName)}</div>
    </div>
    ${opts.right || ''}
  </div>
  <main><div id="pageContent">${inner}</div></main>
  ${(state.user && opts.nav!==false) ? bottomNav() : ''}
  ${state.user ? floatWidget() : ''}
  `;
}
const ICONS = {
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  users:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.7.4 4.5 2.4 4.5 5.8"/></svg>`,
  flag:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/></svg>`,

function bottomNav(){
  const items = [
    ['#/profile', ICONS.home, 'โปรไฟล์'],
    ['#/members', ICONS.users, 'สมาชิก'],
    ['#/feed', ICONS.camera, 'ผลงาน'],
    ['#/missions', ICONS.flag, 'ภารกิจ'],
    ['#/events', ICONS.bell, 'กิจกรรม'],
    ['#/wheel', ICONS.spin, 'วงล้อ'],
  ];
  return `<div class="bottomnav" id="bottomNav"><div class="nav-indicator" id="navIndicator"></div>${items.map(([r,i,l])=>`
    <button class="navbtn ${state.route===r?'active':''}" data-action="goto" data-route="${r}">${i}<span>${l}</span></button>
  `).join('')}</div>`;
}
function positionNavIndicator(){
  const nav = document.getElementById('bottomNav');
  const ind = document.getElementById('navIndicator');
  if(!nav || !ind) return;
  const active = nav.querySelector('.navbtn.active');
  if(!active){ ind.style.width='0px'; return; }
  const navRect = nav.getBoundingClientRect(), r = active.getBoundingClientRect();
  ind.style.left = (r.left - navRect.left + r.width*0.25) + 'px';
  ind.style.width = (r.width*0.5) + 'px';
}
function floatWidget(){
  if(!state.user) return '';
  const users = state.allUsers.length ? state.allUsers : [state.profile].filter(Boolean);
  const list = users.slice(0,20).map(u=>{
    const st = u.status || 'ออฟไลน์';
    const cls = st.includes('ออนไลน์')?'online':(st.includes('ไม่ว่าง')?'busy':'off');
    return `<div class="item"><span class="dot ${cls}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.stageName||u.nickname||'สมาชิก')}</span><span class="muted">${esc(st)}</span></div>`;
  }).join('') || `<div class="empty">ไม่มีข้อมูล</div>`;
  return `
  <div class="float-status">
    <button class="float-toggle ${state.floatOpen?'on':''}" data-action="toggle-float">${ICONS.eye}</button>
    ${state.floatOpen ? `<div class="float-panel">${list}</div>` : ''}
  </div>`;
}

async function loadHistoryInto(){
  if(!state.user) return;
  try{
    const ms = await db.collection('missionHistory').where('uid','==',state.user.uid).orderBy('acceptedAt','desc').limit(30).get();
    const el = document.getElementById('myMissionHistory');
    if(el){
      const rows = ms.docs.map(d=>{
        const h = d.data(); const mm = state.missions.find(x=>x.id===h.missionId);
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
          <div style="font-weight:600;">${esc(mm?mm.title:'ภารกิจ')}</div>
          <div class="muted">รับ: ${fmtDate(h.acceptedAt)} · ส่ง: ${h.submittedAt?fmtDate(h.submittedAt):'ยังไม่ส่ง'} · ${esc(h.status||'')}</div>
        </div>`;
      }).join('');
      el.innerHTML = rows || `<div class="empty">ยังไม่มีประวัติ</div>`;
    }
  }catch(e){ console.warn(e); }
  try{
    const sp = await db.collection('spinHistory').where('uid','==',state.user.uid).orderBy('at','desc').limit(30).get();
    const el2 = document.getElementById('mySpinHistory');
    if(el2){
      const rows = sp.docs.map(d=>{
        const h = d.data();
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
          <div style="font-weight:600;">${esc(h.prize)}</div>
          <div class="muted">${fmtDate(h.at)}</div>
        </div>`;
      }).join('');
      el2.innerHTML = rows || `<div class="empty">ยังไม่มีประวัติ</div>`;
    }
  }catch(e){ console.warn(e); }
}

function attachPostFormGeoHandler(){
  const btn = document.getElementById('po_geoBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    if(!navigator.geolocation){ toast('อุปกรณ์นี้ไม่รองรับการปักหมุด'); return; }
    document.getElementById('po_geoHint').textContent = 'กำลังค้นหาตำแหน่ง...';
    navigator.geolocation.getCurrentPosition(pos=>{
      window.__postGeo = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      document.getElementById('po_geoHint').textContent = `ปักหมุดแล้ว (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
    }, err=>{
      document.getElementById('po_geoHint').textContent = 'ไม่สามารถเข้าถึงตำแหน่งได้';
    });
  });
}

function render(){
  const [path, param] = state.route.split(':');
  let html = '';
  if(path === '#/admin'){
    html = pageAdmin();
  } else if(!state.user){
    html = pageLogin();
  } else {
    switch(path){
      case '#/profile': html = pageProfile(); break;
      case '#/members': html = pageMembers(); break;
      case '#/member': html = pageMemberView(param); break;
      case '#/feed': html = pagePosts(param); break;
      case '#/missions': html = pageMissions(); break;
      case '#/mission': html = pageMissionView(param); break;
      case '#/events': html = pageEvents(); break;
      case '#/history': html = pageHistory(); break;
      case '#/wheel': html = pageWheel(); break;

}

  document.querySelectorAll('#pageContent > .card, #pageContent .grid-members > *').forEach((el,i)=>{

/* ---------------- wheel drawing/spin ---------------- */
function drawWheelCanvas(){
  const wheels = state.wheels;
  const active = wheels.find(w=>w.id===state.activeWheelId) || wheels[0];
  const canvas = document.getElementById('wheelCanvas');
  if(!canvas || !active) return;
  const ctx = canvas.getContext('2d');
  const prizes = (active.prizes||[]).filter(p=>p.pct>0);
  const total = prizes.reduce((a,b)=>a+Number(b.pct||0),0) || 1;
  let start = state.wheelRotation || 0;
  function paint(rot){
    ctx.clearRect(0,0,280,280);
    ctx.save(); ctx.translate(140,140); ctx.rotate(rot);
    let ang = -Math.PI/2;
    const colors = ['#e7e5df','#c9c7c1','#9a9a95','#6d6d68','#4a4a46','#2e2e2b'];
    prizes.forEach((p,i)=>{
      const slice = (p.pct/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,130,ang,ang+slice); ctx.closePath();
      ctx.fillStyle = colors[i%colors.length]; ctx.fill();
      ctx.strokeStyle = '#0a0a0a'; ctx.stroke();
      ctx.save(); ctx.rotate(ang+slice/2); ctx.fillStyle='#0a0a0a'; ctx.font='11px Noto Sans Thai';
      ctx.fillText((p.name||'').slice(0,10), 40, 4); ctx.restore();
      ang += slice;
    });
    ctx.restore();
  }
  paint(start);
  canvas.__paint = paint; canvas.__prizes = prizes; canvas.__total = total;
}
let spinning = false;
async function doSpin(wheelId){
  if(spinning) return; spinning = true;
  const canvas = document.getElementById('wheelCanvas');
  const resEl = document.getElementById('spinResult');
  const prizes = canvas.__prizes, total = canvas.__total;
  let r = Math.random()*total, acc=0, chosen=prizes[0], chosenIdx=0;
  for(let i=0;i<prizes.length;i++){ acc+=Number(prizes[i].pct||0); if(r<=acc){chosen=prizes[i]; chosenIdx=i; break;} }
  // compute target angle so pointer (top) lands mid-slice of chosen
  let ang=0; for(let i=0;i<chosenIdx;i++) ang += (prizes[i].pct/total)*Math.PI*2;
  const mid = ang + (prizes[chosenIdx].pct/total)*Math.PI; // slice midpoint from start(-90deg offset baked in paint)
  const targetRot = Math.PI*2*6 - mid; // spin 6 extra turns, land so slice sits at top pointer
  const startTime = performance.now(); const dur = 3200; const startRot = state.wheelRotation||0;
  function frame(t){
    const p = Math.min(1,(t-startTime)/dur);
    const ease = 1-Math.pow(1-p,3);
    const rot = startRot + (targetRot-startRot)*ease;
    canvas.__paint(rot);
    if(p<1) requestAnimationFrame(frame);
    else{
      state.wheelRotation = targetRot % (Math.PI*2);
      spinning = false;
      resEl.textContent = 'คุณได้รับ: ' + (chosen.name||'-');
      toast('ยินดีด้วย! ได้ ' + (chosen.name||'-'));
      if(state.user){
        db.collection('spinHistory').add({uid:state.user.uid, wheelId, prize:chosen.name, at: firebase.firestore.FieldValue.serverTimestamp()}).catch(console.warn);
      }
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  try{

  if(action==='back'){ back(); return; }
  if(action==='goto'){ nav(t.dataset.route); return; }
  if(action==='toggle-float'){ state.floatOpen = !state.floatOpen; render(); return; }
  if(action==='close-modal'){ if(e.target===t){ state.modal=null; render(); } return; }
  if(action==='logout'){ await auth.signOut(); return; }
  if(action==='admin-logout'){ state.adminAuthed=false; sessionStorage.removeItem('hijime_admin'); nav('#/profile', false); return; }

  if(action==='edit-profile'){ state.editCharacters = ((state.profile&&state.profile.characters)||[]).slice(); state.modal = editProfileModal(); render(); attachAuthTabHandlersIfNeeded(); return; }
  if(action==='add-character'){
    const inp = document.getElementById('f_newCharacter');
    const name = (inp.value||'').trim();
    if(!name) return;
    state.editCharacters = (state.editCharacters||[]).concat([name]);
    state.modal = editProfileModal(); render();
    return;
  }
  if(action==='remove-character'){
    const i = Number(t.dataset.i);
    state.editCharacters = (state.editCharacters||[]); state.editCharacters.splice(i,1);
    state.modal = editProfileModal(); render();
    return;
  }
  if(action==='add-portfolio'){ state.modal = portfolioModal(); render(); return; }
  if(action==='add-post'){ state.modal = postFormModal(); window.__postGeo=null; render(); attachPostFormGeoHandler(); return; }
  if(action==='toggle-like'){
    const id = t.dataset.id;
    const p = state.posts.find(x=>x.id===id); if(!p) return;
    const uid = state.user.uid;
    const liked = (p.likes||[]).includes(uid);
    const ref = db.collection('posts').doc(id);
    if(liked){
      p.likes = (p.likes||[]).filter(x=>x!==uid);
      ref.update({likes: firebase.firestore.FieldValue.arrayRemove(uid)}).catch(console.warn);
    } else {
      p.likes = (p.likes||[]).concat([uid]);
      ref.update({likes: firebase.firestore.FieldValue.arrayUnion(uid)}).catch(console.warn);
    }
    render(); return;
  }
  if(action==='toggle-comments'){ const id=t.dataset.id; state.openComments[id] = !state.openComments[id]; render(); return; }
  if(action==='send-comment'){
    const id = t.dataset.id;
    const inp = document.getElementById('commentInput-'+id);
    const text = (inp.value||'').trim();
    if(!text) return;
    const p = state.profile||{};
    const comment = {uid:state.user.uid, name:p.stageName||p.nickname||'สมาชิก', photoURL:p.photoURL||'', text, at: firebase.firestore.Timestamp.now()};
    const post = state.posts.find(x=>x.id===id); if(!post) return;
    post.comments = (post.comments||[]).concat([comment]);
    inp.value='';
    render();
    db.collection('posts').doc(id).update({comments: firebase.firestore.FieldValue.arrayUnion(comment)}).catch(console.warn);
    return;
  }
  if(action==='del-post'){
    const id = t.dataset.id;
    db.collection('posts').doc(id).delete().catch(console.warn);
    state.posts = state.posts.filter(x=>x.id!==id);
    render(); toast('ลบโพสต์แล้ว'); return;
  }
  if(action==='del-portfolio'){
    const i = Number(t.dataset.i);
    const portfolio = (state.profile.portfolio||[]).slice(); portfolio.splice(i,1);
    await db.collection('users').doc(state.user.uid).update({portfolio});
    state.profile.portfolio = portfolio; render(); toast('ลบผลงานแล้ว'); return;
  }
  if(action==='view-member'){ nav('#/member:'+t.dataset.id); return; }
  if(action==='filter-mission'){ state.missionFilter = t.dataset.cat || null; render(); return; }
  if(action==='view-mission'){ nav('#/mission:'+t.dataset.id); return; }
  if(action==='goto-mission-from-event'){ nav('#/mission:'+t.dataset.id); return; }
  if(action==='join-mission'){
    const id = t.dataset.id;
    const m = state.missions.find(x=>x.id===id);
    const participants = (m.participants||[]).concat([state.user.uid]);
    await db.collection('missions').doc(id).update({participants});
    m.participants = participants;
    await db.collection('missionHistory').add({uid:state.user.uid, missionId:id, acceptedAt:firebase.firestore.FieldValue.serverTimestamp(), status:'กำลังทำ'});
    render(); toast('เข้าร่วมภารกิจแล้ว'); return;
  }
  if(action==='submit-mission'){
    const id = t.dataset.id;
    try{
      const q = await db.collection('missionHistory').where('uid','==',state.user.uid).where('missionId','==',id).orderBy('acceptedAt','desc').limit(1).get();
      if(!q.empty){
        await q.docs[0].ref.update({submittedAt:firebase.firestore.FieldValue.serverTimestamp(), status:'ส่งแล้ว'});
        toast('ส่งภารกิจแล้ว รอตรวจสอบ');
      }
    }catch(err){ console.warn(err); toast('ส่งภารกิจแล้ว'); }
    return;
  }
  if(action==='pick-wheel'){ state.activeWheelId = t.dataset.id; state.wheelRotation=0; render(); return; }

  // admin
  if(action==='admin-tab'){
    state.adminTab = t.dataset.tab;
    document.querySelectorAll('#adminTabs .btn').forEach(b=>{b.classList.remove('btn-accent');});
    t.classList.add('btn-accent');
    const body = document.getElementById('adminBody');
    body.style.animation='none'; body.offsetHeight; body.style.animation='pageIn .3s cubic-bezier(.2,.8,.2,1) both';
    body.innerHTML = adminTabBody(state.adminTab);
    body.querySelectorAll('.card').forEach((el,i)=>{ el.style.animationDelay = Math.min(i*0.045,0.4)+'s'; });
    return;
  }
  if(action==='save-site'){
    const data = { siteName:$('#a_siteName').value, accent:$('#a_accent').value, adminUser:$('#a_adminUser').value, adminPass:$('#a_adminPass').value };
    const file = document.getElementById('a_logoFile').files[0];
    if(file){ toast('กำลังอัปโหลดโลโก้...'); data.logoURL = await uploadImage(file, 'site/logo', 300); }
    await db.collection('siteConfig').doc('main').set(data, {merge:true});
    state.siteConfig = Object.assign(state.siteConfig, data); applyTheme(); render(); toast('บันทึกการตั้งค่าแล้ว'); return;
  }
  if(action==='save-member'){
    const id = t.dataset.id;
    const points = Number(document.querySelector(`.m_points[data-id="${id}"]`).value||0);
    const status = document.querySelector(`.m_status[data-id="${id}"]`).value;
    await db.collection('users').doc(id).update({points, status});
    const u = state.allUsers.find(x=>x.id===id); if(u){u.points=points; u.status=status;}
    toast('บันทึกแล้ว'); return;
  }
  if(action==='add-cat'){
    const name = document.getElementById('newCatName').value.trim();
    if(!name) return;
    await db.collection('missionCategories').add({name});
    await loadMissionCats(); document.getElementById('adminBody').innerHTML = adminTabBody('cats'); return;
  }
  if(action==='admin-del-post'){
    await db.collection('posts').doc(t.dataset.id).delete();
    await loadPosts(); document.getElementById('adminBody').innerHTML = adminTabBody('posts'); toast('ลบโพสต์แล้ว'); return;
  }
  if(action==='del-cat'){ await db.collection('missionCategories').doc(t.dataset.id).delete(); await loadMissionCats(); document.getElementById('adminBody').innerHTML = adminTabBody('cats'); return; }
  if(action==='new-mission'){ state.editingMission=null; state.modal = missionFormModal(null); render(); return; }
  if(action==='edit-mission'){ const m = state.missions.find(x=>x.id===t.dataset.id); state.editingMission=m; state.modal = missionFormModal(m); render(); return; }
  if(action==='del-mission'){ await db.collection('missions').doc(t.dataset.id).delete(); await loadMissions(); document.getElementById('adminBody').innerHTML = adminTabBody('missions'); return; }
  if(action==='new-event'){ state.editingEvent=null; state.modal = eventFormModal(null); render(); return; }
  if(action==='edit-event'){ const ev = state.events.find(x=>x.id===t.dataset.id); state.editingEvent=ev; state.modal = eventFormModal(ev); render(); return; }
  if(action==='del-event'){ await db.collection('events').doc(t.dataset.id).delete(); await loadEvents(); document.getElementById('adminBody').innerHTML = adminTabBody('events'); return; }
  if(action==='new-wheel'){ state.modal = wheelFormModal(null); render(); attachPrizeRowHandler(); return; }
  if(action==='edit-wheel'){ const w = state.wheels.find(x=>x.id===t.dataset.id); state.modal = wheelFormModal(w); render(); attachPrizeRowHandler(); return; }
  if(action==='del-wheel'){ await db.collection('wheels').doc(t.dataset.id).delete(); await loadWheels(); document.getElementById('adminBody').innerHTML = adminTabBody('wheels'); return; }

  if(t.id==='spinBtn'){ doSpin(t.dataset.id); return; }

  }catch(err){
    console.error('[hijime] action error:', action, err);
    toast('เกิดข้อผิดพลาด: ' + (err && (err.message || err.code) || 'ไม่ทราบสาเหตุ'));
  }
});
function attachPrizeRowHandler(){
  const btn = document.getElementById('addPrizeRow');
  if(btn) btn.addEventListener('click', ()=>{
    document.getElementById('prizeRows').insertAdjacentHTML('beforeend', prizeRow({name:'',pct:0}));
  });
}
document.addEventListener('click', (e)=>{
  const tab = e.target.closest('#authTabs button');
  if(tab){
    document.querySelectorAll('#authTabs button').forEach(b=>{b.classList.remove('btn-accent');b.classList.add('btn-ghost');});
    tab.classList.add('btn-accent'); tab.classList.remove('btn-ghost');
    document.getElementById('authSubmit').textContent = tab.dataset.tab==='register' ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  }
});
function attachAuthTabHandlersIfNeeded(){}

/* ---------------- boot ---------------- */
async function boot(){
  await loadSiteConfig();
  render();
  if(state.adminAuthed) await Promise.all([loadAllUsers(), loadPosts()]).then(render).catch(console.warn);
  auth.onAuthStateChanged(async ()=>{
    if(state.user){
      await Promise.all([loadAllUsers(), loadMissions(), loadMissionCats(), loadEvents(), loadWheels(), loadPosts()]);
      render();
    }
  });
}
boot();
</script>
</body>
</html>
